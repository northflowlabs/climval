site_name: climval
site_description: Validate climate model output against reference data, aligned in space, time and units
site_url: https://northflowlabs.github.io/climval/
site_author: Northflow Technologies AS
repo_url: https://github.com/northflowlabs/climval
repo_name: northflowlabs/climval
edit_uri: edit/main/docs/
copyright: Copyright 2026 Northflow Technologies AS. Apache License 2.0.

theme:
  name: material
  logo: assets/northflow-mark.svg
  favicon: assets/northflow-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  __pycache__/

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["examples/*.ipynb"]
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Alignment: concepts/alignment.md
      - Samples and groups: concepts/samples.md
      - Metrics: concepts/metrics.md
      - Provenance: concepts/provenance.md
  - How-to guides:
      - Pangeo and cloud data: how-to/cloud-data.md
      - CMIP6 through intake-esm: how-to/cmip6-intake-esm.md
      - Regions: how-to/regions.md
      - Calendars and frequencies: how-to/calendars.md
      - Units: how-to/units.md
      - Thresholds and the CI gate: how-to/ci-gate.md
      - The GitHub Action: how-to/github-action.md
      - Migrating from 0.1: how-to/migrating.md
  - Examples:
      - Overview: examples/index.md
      - ERA5 against CMIP6 over Europe: examples/era5_cmip6_europe.ipynb
      - A CI gate on real data: examples/ci_gate_real_data.ipynb
  - API reference:
      - compare and Comparison: reference/compare.md
      - Alignment: reference/align.md
      - Regions: reference/regions.md
      - Metrics: reference/metrics.md
      - Thresholds: reference/thresholds.md
      - climval check: reference/gate.md
      - Errors: reference/errors.md
      - Command line: reference/cli.md
  - Changelog: changelog.md
  - Citation: citation.md
