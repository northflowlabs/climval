name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=climval --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  minimum-versions:
    name: Lowest supported versions (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Pin every core dependency to its lower bound
        run: |
          python - <<'EOF'
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text()
          block = re.search(r"^dependencies = \[(.*?)^\]", text, re.S | re.M).group(1)
          pins = []
          for spec in re.findall(r'"([^"]+)"', block):
              m = re.match(r"\s*([A-Za-z0-9_.-]+)(?:\[[^]]*\])?\s*>=\s*([^,;\s]+)", spec)
              if m is None:
                  print(f"no lower bound, left free: {spec}")
                  continue
              name, low = m.groups()
              pins.append(f"{name}=={low}")
          pathlib.Path("constraints.txt").write_text("\n".join(pins) + "\n")
          print("\n".join(pins))
          EOF
      - name: Install climval with the lower bounds
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . "pytest>=7.4"
          pip list
      - name: Run tests
        run: pytest -q

  minimum-versions-extras:
    name: Lowest supported versions with extras (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      # uv resolves every direct requirement (core and the extras below) to the
      # lowest version its specifier allows that exists, for example
      # intake-esm 2025.2.3 for "intake-esm>=2025.2.3", and leaves the rest free.
      # Left out: "regrid" (xESMF needs the ESMF library from conda-forge; the
      # xesmf job covers it with current versions), "cftime" (an alias of a core
      # dependency) and "docs" and "dev" (tools, not runtime requirements).
      - name: Install climval and the extras at their lower bounds
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.11.14"
          uv pip install --system --resolution lowest-direct -e ".[netcdf,units,regions,catalog,cloud]" "pytest>=7.4"
          uv pip list --system
      - name: Run tests
        run: pytest -q

  core-only:
    name: Core install (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install core and test runner only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests (zarr, netCDF, xskillscore and pint tests skip)
        run: pytest -q

  extras:
    name: Optional extras (regions, cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install with regions and cloud extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,regions,cloud]"
      - name: Run tests
        run: pytest -q

  xesmf:
    name: Conservative regridding (xESMF, conda)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          python-version: "3.12"
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install xESMF from conda-forge, climval from source
        run: |
          conda install -y xesmf
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check climval/ tests/

      - name: Mypy (type check)
        run: mypy climval/
