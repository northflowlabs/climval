name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=climval --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  minimum-versions:
    name: Lowest supported versions (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Pin every core dependency to its lower bound
        run: |
          python - <<'EOF'
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text()
          block = re.search(r"^dependencies = \[(.*?)^\]", text, re.S | re.M).group(1)
          pins = []
          for spec in re.findall(r'"([^"]+)"', block):
              name, low = re.match(r"([A-Za-z0-9_.-]+)(?:\[[^]]*\])?>=([^,;]+)", spec).groups()
              pins.append(f"{name}=={low}")
          pathlib.Path("constraints.txt").write_text("\n".join(pins) + "\n")
          print("\n".join(pins))
          EOF
      - name: Install climval with the lower bounds
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e . "pytest>=7.4"
          pip list
      - name: Run tests
        run: pytest -q

  core-only:
    name: Core install (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and test runner only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests (zarr, netCDF, xskillscore and pint tests skip)
        run: pytest -q

  extras:
    name: Optional extras (regions, cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with regions and cloud extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,regions,cloud]"
      - name: Run tests
        run: pytest -q

  xesmf:
    name: Conservative regridding (xESMF, conda)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install xESMF from conda-forge, climval from source
        run: |
          conda install -y xesmf
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check climval/ tests/

      - name: Mypy (type check)
        run: mypy climval/
