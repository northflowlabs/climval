name: Feature request
description: A metric, an alignment option, an input format or another addition
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need to do
      description: The comparison or workflow you want to run and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, with references for metrics or methods.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other tools that do it.
